<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind Static Site</title>
  <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <header class="bg-brand text-white">
    <div class="mx-auto max-w-3xl px-6 py-4">
      <h1 class="text-2xl font-bold">Brand Demo</h1>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-10">
    <p class="mb-6 text-lg">
      This is a plain static HTML page styled with Tailwind CSS, using a custom
      <span class="font-semibold text-brand">brand</span> colour.
    </p>

    <button class="rounded-md bg-brand px-4 py-2 font-medium text-white shadow hover:opacity-90">
      Click me
    </button>
  </main>
</body>
</html>
